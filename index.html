<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home work</title>
</head>
<style>
    .container
    {
        display: grid;
        grid-template-columns: 100px 100px 100px 100PX;
        grid-template-rows: 100px 100px 100px;
        gap: 10px;
        color: white;
    }
    .item1
    {
        grid-column: 1/2;
        background-color: blue;
        border: 3px solid black;
    }
    .item2
    {
        grid-column: 2/3;
        /* grid-column: 3/4; */
        background-color: rgb(102, 202, 202);
        border: 3px solid black;
    }
    .item3
    {
        background-color: rgb(13, 97, 13);
        grid-column: 3/5;
        border: 3px solid black;
    }
    .item4
    {
        background-color: rgb(187, 255, 0);
        grid-column: 1/5;
        border: 3px solid black;
    }
    .item5
    {
        grid-column: 1/3;
        background-color: rgb(124, 112, 112);
        border: 3px solid black;
    }
    .item6
    {
        grid-column:3/5 ;
        background-color: rgb(235, 135, 135);
        border: 3px solid black;
    }
</style>
<body>
    <div class="container">
        <div class="item1">A</div>
        <div class="item2">B</div>
        <div class="item3">c</div>
        <div class="item4">D</div>
        <div class="item5">E</div>
        <div class="item6">F</div>
    </div>
</body>
</html>
