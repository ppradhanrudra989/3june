<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter R</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(5, 100px);
            grid-template-rows: repeat(6, 100px);
            gap: 10px;
        }

        .t {
            width: 100px;
            height: 100px;
            background-color: rgb(248, 252, 22);
            border: 4px solid black;
        }

        .box1 {
            grid-column: 1;
            grid-row: 1;
        }

        .box2 {
            grid-column: 1;
            grid-row: 2;
        }

        .box3 {
            grid-column: 1;
            grid-row: 3;
        }

        .box4 {
            grid-column: 1;
            grid-row: 4;
        }

        .box5 {
            grid-column: 1;
            grid-row: 5;
        }

        .box6 {
            grid-column: 2;
            grid-row: 1;
        }

        .box7 {
            grid-column: 3;
            grid-row: 1;
        }

        .box8 {
            grid-column: 3;
            grid-row: 2;
        }

        .box9 {
            grid-column: 2;
            grid-row: 3;
        }

        .box10 {
            grid-column: 3;
            grid-row: 3;
        }

        .box11 {
            grid-column: 2;
            grid-row: 4;
        }

        .box12 {
            grid-column: 3;
            grid-row: 5;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="t box1"></div>
        <div class="t box2"></div>
        <div class="t box3"></div>
        <div class="t box4"></div>
        <div class="t box5"></div>

        <div class="t box6"></div>
        <div class="t box7"></div>

        <div class="t box8"></div>

        <div class="t box9"></div>
        <div class="t box10"></div>

        <div class="t box11"></div>
        <div class="t box12"></div>
    </div>

</body>

</html>
