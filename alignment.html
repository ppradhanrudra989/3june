<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
</head>
<style>
    .container
    {
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
        grid-template-rows: 1fr 2fr 1fr;
        height: 500px;
    }
    .item1
    {
        border: 1px solid black;
        display: grid;
    }
    .item2
    {
        border: 1px solid black;
        display: grid;
    }
    .item3
    {
        border: 1px solid black;
        display: grid;
    }
    .item4
    {
        border: 1px solid black;
        display: grid;
    }
    .item5
    {
        border: 1px solid black;
        display: grid;
    }
    .item6
    {
        border: 1px solid black;
        display: grid;
    }
    .item7
    {
        border: 1px solid black;
        display: grid;
    }
    .item8
    {
        border: 1px solid black;
        display: grid;
    }
    .item9
    {
        border: 1px solid black;
    }
    .inner1
    {
        height: 70px;
        width: 70px;
        background-color: rgb(255, 0, 0);
        justify-self: end;
        align-self: end;
    
    }
    .inner2
    {
        height: 70px;
        width: 70px;
        background-color: rgb(255, 0, 0);
        justify-self: center;
        align-self: center;
    }
    .inner3
    {
        height: 70px;
        width: 70px;
        background-color: rgb(255, 0, 0);
        align-self: end;
        
    }
    .inner4~
    {
        height: 70px;
        width: 70px;
        background-color: rgb(255, 0, 0);
        justify-self: start;  
    }
    .inner5
    {
        height: 70px;
        width: 70px;
        background-color: blue;
        justify-self: center;
        align-self: end;  
    }
    .inner6
    {
        height: 70px;
        width: 70px;
        background-color: blue;
        justify-self: end;  
    }
    .inner7
    {
        height: 70px;
        width: 70px;
        background-color: blue;
        justify-self: end;
        align-self: center;  
    }
    .inner8
    {
        height: 70px;
        width: 70px;
        background-color: blue;
        justify-self: start; 
        align-self: center; 
    }
    .inner9
    {
        height: 70px;
        width: 70px;
        background-color: blue;
        justify-self: start; 
        align-self: center; 
    }
</style>
<body>
    <div class="container">
        <div class="item1">
            <div class="inner1"></div>
        </div>
        <div class="item2">
            <div class="inner2"></div>
        </div>
        <div class="item3">
            <div class="inner3"></div>
        </div>
        <div class="item4">
            <div class="inner4"></div>
        </div>
        <div class="item5">
            <div class="inner5"></div>
        </div>
        <div class="item6">
            <div class="inner6"></div>
        </div>
        <div class="item7">
            <div class="inner7"></div>
        </div>
        <div class="item8">
            <div class="inner8"></div>
        </div>
        <div class="item9">
            <div class="inner9"></div>
        </div>

    </div>
</body>
</html>
