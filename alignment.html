<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 100vh;
            display: grid;
            place-items: center;
            background: lightgray;
        }

        .container{
            width: 800px;
            height: 500px;
            border: 4px solid black;

            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 2fr 1fr;
        }

        .box{
            border: 2px solid black;
            position: relative;
        }

        .small{
            width: 60px;
            height: 40px;
            border: 4px solid black;
            position: absolute;
        }

        .top-left{
            top: 35px;
            right: -30px;
        }

        .top-center{
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
        }

        .top-right{
            top: 35px;
            left: -5px;
        }

        .bottom-left{
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
        }

        .bottom-right{
            bottom: 0;
            left: 0;
        }

    </style>
</head>
<body>

    <div class="container">

        <div class="box">
            <div class="small top-left"></div>
        </div>

        <div class="box">
            <div class="small top-center"></div>
        </div>

        <div class="box">
            <div class="small top-right"></div>
        </div>

        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>

        <div class="box">
            <div class="small bottom-left"></div>
        </div>

        <div class="box"></div>

        <div class="box">
            <div class="small bottom-right"></div>
        </div>

    </div>

</body>
</html>
